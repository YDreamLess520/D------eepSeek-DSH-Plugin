# dsh-d-eepseek — D-------eepSeek（深度议会）
#
# 装好即生效：每条用户消息在**第一轮思考内**先并行派发 N 路深挖子 agent，
# 结果返回后只输出一版综合答案。默认不追加"回合结束后再补一轮"。
#
# 要改参数，在你的 profile 的 cordis.patch.yml 里按 row id 覆盖本行 config 即可
# （profile 的 patch 层在 bundle 层之后应用，优先级更高）。例如：
#
#   - id: d-eepseek
#     name: dsh-d-eepseek
#     config:
#       dimensions: 7
#       gateRetries: 0
#
# 可用字段：
#   enabled            boolean，false = 整插件停用（默认 true）
#   dimensions         议会并行维度数（子 agent 个数，除总 agent 外），7..15（默认 10）
#   gateRetries        本轮派发不足时最多补发几次 followup，0..2（默认 1，0 = 不补）
#   extraPasses        综合完成后追加的深化回合数，0..3（默认 0）
#   reasoningEffort    off|low|high|max|false（默认 max；false = 不改请求）
#   effortProviders    string[]，允许强制 effort 的 provider（默认 ['deepseek-account']）
#   workflowToolName   workflow 工具名（默认 `workflow`）
#   trivialBypass      true 时极短寒暄消息跳过议会要求（默认 false）
#   autoTier           true 时按消息复杂度自动选 7 / 10 / 15 路（代码默认 false；本文件启用）
#   maxCallsPerTurn    同一回合最多几次 workflow 调用，1..3（默认 2；第 3 次由 pre-execute 硬拦）
#   sectionOrder       系统提示排序位（默认 10300）
- insert:
    - id: d-eepseek
      name: dsh-d-eepseek
      config:
        dimensions: 10
        gateRetries: 1
        extraPasses: 0
        reasoningEffort: max
        trivialBypass: false
        autoTier: true
        maxCallsPerTurn: 2
